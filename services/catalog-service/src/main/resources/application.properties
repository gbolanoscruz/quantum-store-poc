quarkus.http.port=${PORT:8081}

# PostgreSQL (Neon) — credenciales inyectadas solo por variables de entorno
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${CATALOG_DB_URL}
%prod.quarkus.datasource.username=${CATALOG_DB_USER}
%prod.quarkus.datasource.password=${CATALOG_DB_PASSWORD}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.idle-removal-interval=2M

# Flyway administra el esquema; Hibernate no altera tablas en producción
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# CORS para tu frontend en Cloudflare Workers y pruebas locales
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://quantum-store-poc.gbolanoscruz.workers.dev,http://localhost:3000,http://localhost:5173

# Observability — Identity, Structured JSON Logs (GCP) & OpenTelemetry Context Propagation
quarkus.application.name=catalog-service
quarkus.log.console.json.log-format=gcp
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# OpenTelemetry: propaga traceparent entre microservicios e inyecta traceId/spanId en logs
# Sin exportador OTLP externo para mantener $0 y evitar sobrecarga en Cloud Run
quarkus.otel.exporter.otlp.enabled=false