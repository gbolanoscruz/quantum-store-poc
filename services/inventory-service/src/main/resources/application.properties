quarkus.http.port=8082

# PostgreSQL (Neon — inventory_db)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${INVENTORY_DB_URL}
quarkus.datasource.username=${INVENTORY_DB_USER}
quarkus.datasource.password=${INVENTORY_DB_PASSWORD}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.idle-removal-interval=2M

# Flyway administra el esquema
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Comunicación interna por Docker network (quantum-net)
quarkus.rest-client.catalog-api.url=${CATALOG_SERVICE_URL:http://catalog-service:8081}

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://quantum-store-poc.gbolanoscruz.workers.dev,http://localhost:3000,http://localhost:5173