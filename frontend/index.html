<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Store — Cloud-Native Microservices PoC</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --border: #232d42;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    h1 { font-size: 1.75rem; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.offline { background: var(--danger); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .sku {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      width: fit-content;
    }

    .card h3 { font-size: 1.1rem; }
    .card p { color: var(--muted); font-size: 0.9rem; flex: 1; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .price { font-size: 1.2rem; font-weight: 700; color: var(--success); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn-primary { background: var(--accent); color: #082f49; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-danger {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.22); }

    form { display: flex; flex-direction: column; gap: 0.85rem; }
    label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); }

    input, textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-family: inherit;
      font-size: 0.9rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .feedback {
      font-size: 0.85rem;
      min-height: 1.25rem;
      color: var(--muted);
    }
    .feedback.error { color: var(--danger); }
    .feedback.ok { color: var(--success); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Quantum Store</h1>
        <p class="subtitle">Quarkus (Java 21) &bull; Oracle Cloud &bull; Neon PostgreSQL &bull; Cloudflare Workers</p>
      </div>
      <div class="status-badge">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Connecting to catalog-service...</span>
      </div>
    </header>

    <div class="layout">
      <main>
        <div id="products-grid" class="grid">
          <div class="empty">Loading products from Neon PostgreSQL...</div>
        </div>
      </main>

      <aside class="card">
        <h3>Add Product</h3>
        <form id="product-form">
          <label>
            SKU
            <input name="sku" required maxlength="64" placeholder="QTM-SSD-004" />
          </label>
          <label>
            Name
            <input name="name" required maxlength="150" placeholder="NVMe Quantum Drive 2TB" />
          </label>
          <label>
            Description
            <textarea name="description" rows="3" placeholder="High-throughput PCIe 5.0 storage"></textarea>
          </label>
          <label>
            Price (USD)
            <input name="price" type="number" step="0.01" min="0" required placeholder="199.99" />
          </label>
          <button id="submit-btn" class="btn-primary" type="submit">Create Product</button>
          <div id="form-feedback" class="feedback"></div>
        </form>
      </aside>
    </div>
  </div>

  <script>
    const API_BASE = "https://quantum-store-api.duckdns.org/api/catalog/products";

    const grid = document.getElementById("products-grid");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const form = document.getElementById("product-form");
    const submitBtn = document.getElementById("submit-btn");
    const feedback = document.getElementById("form-feedback");

    function setStatus(online, message) {
      statusDot.className = "dot " + (online ? "online" : "offline");
      statusText.textContent = message;
    }

    function createProductCard(product) {
      const card = document.createElement("article");
      card.className = "card";

      const sku = document.createElement("span");
      sku.className = "sku";
      sku.textContent = product.sku;

      const title = document.createElement("h3");
      title.textContent = product.name;

      const desc = document.createElement("p");
      desc.textContent = product.description || "No description provided.";

      const footer = document.createElement("div");
      footer.className = "card-footer";

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = `$${Number(product.price).toFixed(2)}`;

      const delBtn = document.createElement("button");
      delBtn.className = "btn-danger";
      delBtn.type = "button";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => deleteProduct(product.id, delBtn));

      footer.append(price, delBtn);
      card.append(sku, title, desc, footer);
      return card;
    }

    async function loadProducts() {
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const products = await res.json();

        setStatus(true, `Catalog Online (${products.length} items)`);
        grid.replaceChildren();

        if (products.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No active products found. Add one using the form.";
          grid.appendChild(empty);
          return;
        }

        products.forEach((p) => grid.appendChild(createProductCard(p)));
      } catch (err) {
        setStatus(false, "Catalog Unreachable");
        grid.replaceChildren();
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = `Could not load catalog: ${err.message}`;
        grid.appendChild(empty);
      }
    }

    async function deleteProduct(id, btn) {
      btn.disabled = true;
      btn.textContent = "Removing...";
      try {
        const res = await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadProducts();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Delete";
        alert(`Failed to delete product: ${err.message}`);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      feedback.className = "feedback";
      feedback.textContent = "Saving to Neon PostgreSQL...";

      const data = new FormData(form);
      const payload = {
        sku: data.get("sku").trim(),
        name: data.get("name").trim(),
        description: data.get("description").trim(),
        price: Number(data.get("price"))
      };

      try {
        const res = await fetch(API_BASE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} (check duplicate SKU)`);

        form.reset();
        feedback.className = "feedback ok";
        feedback.textContent = "Product created!";
        await loadProducts();
      } catch (err) {
        feedback.className = "feedback error";
        feedback.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadProducts();
  </script>
</body>
</html>
