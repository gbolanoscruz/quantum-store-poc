<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Store — Cloud-Native Microservices PoC</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --border: #232d42;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
      --warning: #fbbf24;
      --success: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    h1 { font-size: 1.75rem; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.offline { background: var(--danger); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .sku {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }

    .stock-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .stock-ok {
      color: var(--success);
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
    }
    .stock-low {
      color: var(--warning);
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.3);
    }
    .stock-out {
      color: var(--danger);
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.3);
    }
    .stock-none {
      color: var(--muted);
      background: rgba(148, 163, 184, 0.08);
    }

    .card h3 { font-size: 1.1rem; }
    .card p { color: var(--muted); font-size: 0.9rem; flex: 1; }

    .stock-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(11, 15, 23, 0.55);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
    }

    .stock-actions {
      display: flex;
      gap: 0.35rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .price { font-size: 1.2rem; font-weight: 700; color: var(--success); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      transition: opacity 0.15s, background 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #082f49; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-subtle {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.25rem 0.55rem;
      font-size: 0.75rem;
    }
    .btn-subtle:hover:not(:disabled) { background: rgba(56, 189, 248, 0.22); }

    .btn-danger {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
    }
    .btn-danger:hover:not(:disabled) { background: rgba(248, 113, 113, 0.22); }

    form { display: flex; flex-direction: column; gap: 0.85rem; }
    label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); }

    input, textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-family: inherit;
      font-size: 0.9rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .feedback {
      font-size: 0.85rem;
      min-height: 1.25rem;
      color: var(--muted);
    }
    .feedback.error { color: var(--danger); }
    .feedback.ok { color: var(--success); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Quantum Store</h1>
        <p class="subtitle">Quarkus (Java 21) &bull; Google Cloud Run &bull; Neon PostgreSQL &bull; Cloudflare Workers</p>
      </div>
      <div class="status-group">
        <div class="status-badge">
          <span id="catalog-dot" class="dot"></span>
          <span id="catalog-status">Catalog: connecting...</span>
        </div>
        <div class="status-badge">
          <span id="inventory-dot" class="dot"></span>
          <span id="inventory-status">Inventory: connecting...</span>
        </div>
      </div>
    </header>

    <div class="layout">
      <main>
        <div id="products-grid" class="grid">
          <div class="empty">Loading catalog &amp; live inventory from Google Cloud Run...</div>
        </div>
      </main>

      <aside class="card">
        <h3>Add Product</h3>
        <form id="product-form">
          <label>
            SKU
            <input name="sku" required maxlength="64" placeholder="QTM-SSD-004" />
          </label>
          <label>
            Name
            <input name="name" required maxlength="150" placeholder="NVMe Quantum Drive 2TB" />
          </label>
          <label>
            Description
            <textarea name="description" rows="3" placeholder="High-throughput PCIe 5.0 storage"></textarea>
          </label>
          <label>
            Price (USD)
            <input name="price" type="number" step="0.01" min="0" required placeholder="199.99" />
          </label>
          <label>
            Initial Stock
            <input name="initialStock" type="number" step="1" min="0" value="10" required />
          </label>
          <button id="submit-btn" class="btn-primary" type="submit">Create Product</button>
          <div id="form-feedback" class="feedback"></div>
        </form>
      </aside>
    </div>
  </div>

  <script>
    const CATALOG_API = "https://catalog-service-hlbrzrqapa-uc.a.run.app/api/catalog/products";
    const INVENTORY_API = "https://inventory-service-hlbrzrqapa-uc.a.run.app/api/inventory";

    const grid = document.getElementById("products-grid");
    const catalogDot = document.getElementById("catalog-dot");
    const catalogStatus = document.getElementById("catalog-status");
    const inventoryDot = document.getElementById("inventory-dot");
    const inventoryStatus = document.getElementById("inventory-status");
    const form = document.getElementById("product-form");
    const submitBtn = document.getElementById("submit-btn");
    const feedback = document.getElementById("form-feedback");

    function setBadge(dotEl, textEl, online, message) {
      dotEl.className = "dot " + (online ? "online" : "offline");
      textEl.textContent = message;
    }

    function createStockBadge(stockItem) {
      const badge = document.createElement("span");
      badge.className = "stock-badge ";
      if (!stockItem) {
        badge.className += "stock-none";
        badge.textContent = "No stock record";
        return badge;
      }
      if (stockItem.availableQuantity === 0) {
        badge.className += "stock-out";
        badge.textContent = "Out of stock";
      } else if (stockItem.availableQuantity <= 5) {
        badge.className += "stock-low";
        badge.textContent = `Low stock: ${stockItem.availableQuantity}`;
      } else {
        badge.className += "stock-ok";
        badge.textContent = `In stock: ${stockItem.availableQuantity}`;
      }
      return badge;
    }

    function createProductCard(product, stockItem) {
      const card = document.createElement("article");
      card.className = "card";

      const top = document.createElement("div");
      top.className = "card-top";

      const sku = document.createElement("span");
      sku.className = "sku";
      sku.textContent = product.sku;

      top.append(sku, createStockBadge(stockItem));

      const title = document.createElement("h3");
      title.textContent = product.name;

      const desc = document.createElement("p");
      desc.textContent = product.description || "No description provided.";

      const stockRow = document.createElement("div");
      stockRow.className = "stock-controls";

      const reservedText = document.createElement("span");
      if (stockItem) {
        reservedText.textContent = `Reserved: ${stockItem.reservedQuantity}`;
      } else {
        reservedText.textContent = "Stock uninitialized";
      }

      const actions = document.createElement("div");
      actions.className = "stock-actions";

      if (stockItem) {
        const reserveBtn = document.createElement("button");
        reserveBtn.className = "btn-subtle";
        reserveBtn.type = "button";
        reserveBtn.textContent = "Reserve 1";
        reserveBtn.disabled = stockItem.availableQuantity < 1;
        reserveBtn.addEventListener("click", () => updateReservation(product.sku, "reserve", reserveBtn));

        const releaseBtn = document.createElement("button");
        releaseBtn.className = "btn-subtle";
        releaseBtn.type = "button";
        releaseBtn.textContent = "Release 1";
        releaseBtn.disabled = stockItem.reservedQuantity < 1;
        releaseBtn.addEventListener("click", () => updateReservation(product.sku, "release", releaseBtn));

        actions.append(reserveBtn, releaseBtn);
      } else {
        const initBtn = document.createElement("button");
        initBtn.className = "btn-subtle";
        initBtn.type = "button";
        initBtn.textContent = "Init 10 units";
        initBtn.addEventListener("click", () => initializeStock(product.id, 10, initBtn));
        actions.append(initBtn);
      }

      stockRow.append(reservedText, actions);

      const footer = document.createElement("div");
      footer.className = "card-footer";

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = `$${Number(product.price).toFixed(2)}`;

      const delBtn = document.createElement("button");
      delBtn.className = "btn-danger";
      delBtn.type = "button";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => deleteProduct(product.id, delBtn));

      footer.append(price, delBtn);
      card.append(top, title, desc, stockRow, footer);
      return card;
    }

    async function loadStorefront() {
      const [catalogResult, inventoryResult] = await Promise.allSettled([
        fetch(CATALOG_API).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }),
        fetch(INVENTORY_API).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
      ]);

      const inventoryBySku = new Map();
      if (inventoryResult.status === "fulfilled") {
        inventoryResult.value.forEach((item) => inventoryBySku.set(item.sku, item));
        setBadge(inventoryDot, inventoryStatus, true, `Inventory: Online (${inventoryResult.value.length} SKUs)`);
      } else {
        setBadge(inventoryDot, inventoryStatus, false, "Inventory: Unreachable");
      }

      if (catalogResult.status === "rejected") {
        setBadge(catalogDot, catalogStatus, false, "Catalog: Unreachable");
        grid.replaceChildren();
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = `Could not load catalog: ${catalogResult.reason.message}`;
        grid.appendChild(empty);
        return;
      }

      const products = catalogResult.value;
      setBadge(catalogDot, catalogStatus, true, `Catalog: Online (${products.length} items)`);
      grid.replaceChildren();

      if (products.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No active products found. Add one using the form.";
        grid.appendChild(empty);
        return;
      }

      products.forEach((p) => grid.appendChild(createProductCard(p, inventoryBySku.get(p.sku))));
    }

    async function updateReservation(sku, action, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`${INVENTORY_API}/${encodeURIComponent(sku)}/${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ quantity: 1 })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadStorefront();
      } catch (err) {
        alert(`Failed to ${action} stock: ${err.message}`);
        btn.disabled = false;
      }
    }

    async function initializeStock(productId, quantity, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(INVENTORY_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId, availableQuantity: quantity })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadStorefront();
      } catch (err) {
        alert(`Failed to initialize stock: ${err.message}`);
        btn.disabled = false;
      }
    }

    async function deleteProduct(id, btn) {
      btn.disabled = true;
      btn.textContent = "Removing...";
      try {
        const res = await fetch(`${CATALOG_API}/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadStorefront();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Delete";
        alert(`Failed to delete product: ${err.message}`);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      feedback.className = "feedback";
      feedback.textContent = "Saving product & stock...";

      const data = new FormData(form);
      const payload = {
        sku: data.get("sku").trim(),
        name: data.get("name").trim(),
        description: data.get("description").trim(),
        price: Number(data.get("price"))
      };
      const initialStock = Number(data.get("initialStock"));

      try {
        const res = await fetch(CATALOG_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} (check duplicate SKU)`);
        const created = await res.json();

        const invRes = await fetch(INVENTORY_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId: created.id, availableQuantity: initialStock })
        });
        if (!invRes.ok) throw new Error(`Product saved, but stock failed (HTTP ${invRes.status})`);

        form.reset();
        feedback.className = "feedback ok";
        feedback.textContent = "Product and inventory created!";
        await loadStorefront();
      } catch (err) {
        feedback.className = "feedback error";
        feedback.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadStorefront();
  </script>
</body>
</html>
