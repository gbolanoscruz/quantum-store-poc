name: Build, Scan & Deploy (catalog-service)

on:
  push:
    branches: ["main"]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/deploy-catalog-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbolanoscruz/quantum-store-poc/catalog-service

jobs:
  build-scan-push:
    name: Build, Scan & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally for security scan
        uses: docker/build-push-action@v7
        with:
          context: ./services/catalog-service
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan

      - name: Scan Docker image with Trivy
        # Si VS Code marca error en el tag, usa exactamente el mismo de tu security-scan.yml
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./services/catalog-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-oci:
    name: Deploy to Oracle Cloud
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull & restart container via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          CATALOG_DB_URL: ${{ secrets.CATALOG_DB_URL }}
          CATALOG_DB_USER: ${{ secrets.CATALOG_DB_USER }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,CATALOG_DB_URL,CATALOG_DB_USER,CATALOG_DB_PASSWORD
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop catalog-service || true
            docker rm catalog-service || true
            docker run -d \
              --name catalog-service \
              --restart unless-stopped \
              --memory="300m" \
              -p 127.0.0.1:8081:8081 \
              -e CATALOG_DB_URL="$CATALOG_DB_URL" \
              -e CATALOG_DB_USER="$CATALOG_DB_USER" \
              -e CATALOG_DB_PASSWORD="$CATALOG_DB_PASSWORD" \
              "$IMAGE"
            docker logout ghcr.io
            docker image prune -f
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:8081/q/health/ready; then
                exit 0
              fi
              echo "Waiting for catalog-service ($i/12)..."
              sleep 5
            done
            docker logs catalog-service --tail 30
            exit 1