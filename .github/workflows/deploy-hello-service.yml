name: Build, Scan & Deploy (hello-service)

on:
  push:
    branches: ["main"]
    paths:
      - "services/hello-service/**"
      - ".github/workflows/deploy-hello-service.yml"
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbolanoscruz/quantum-store-poc/hello-service

jobs:
  build-scan-push:
    name: Build, Scan & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally for security scan
        uses: docker/build-push-action@v6
        with:
          context: ./services/hello-service
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./services/hello-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-oci:
    name: Deploy to Oracle Cloud
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull & restart container via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script_stop: true
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop hello-service || true
            docker rm hello-service || true
            docker run -d \
              --name hello-service \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              "$IMAGE"
            docker logout ghcr.io
            docker image prune -f
            sleep 3
            curl -fsS http://localhost:8080/api/hello